name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# Actions are pinned to commit SHAs, not tags. A tag is mutable: an upstream repoint
# changes what this workflow executes with no change in this repository and no review.
# The trailing comment is the human-readable version, and is what Dependabot rewrites
# when it proposes a bump — .github/dependabot.yml keeps the pins from rotting.
#
# Pinned across both jobs deliberately: pinning one job and not the other leaves the
# same untrusted-code path open, which is security theatre rather than security.
jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ["21"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports-java${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14

  # The FoundationDB tests skip without a cluster, so the build job above never runs them.
  # This job runs them against a real one — the official image as a service container — and
  # sets GUMBO_REQUIRE_FDB so that an unreachable cluster fails the job instead of skipping
  # every test and looking green. It is where multiWriter is measured rather than declared:
  # FoundationDBMultiWriterTest is two JVMs on one log.
  #
  # Downstream CI (Catalyst's Dist track) can copy this job as-is: the service container, the
  # client package, the cluster file, and `configure new single memory` are the whole recipe.
  fdb:
    name: FoundationDB (real cluster, two writers)
    runs-on: ubuntu-latest
    env:
      FDB_VERSION: "7.3.43"   # matches fdb.version in pom.xml; the image tag and the client package follow it
    services:
      foundationdb:
        image: foundationdb/foundationdb:7.3.43
        env:
          # Advertise 127.0.0.1 rather than the container's own address, since the client is on
          # the runner and reaches the server through the published port.
          FDB_NETWORKING_MODE: host
        ports:
          - 4500:4500
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install the FoundationDB client library
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb" \
            -o "$RUNNER_TEMP/fdb-clients.deb"
          sudo dpkg -i "$RUNNER_TEMP/fdb-clients.deb"

      # The image starts fdbserver but does not create a database; that is a one-off fdbcli
      # call, retried while the server comes up.
      - name: Create the database
        run: |
          set -euo pipefail
          echo "docker:docker@127.0.0.1:4500" > "$RUNNER_TEMP/fdb.cluster"
          echo "FDB_CLUSTER_FILE=$RUNNER_TEMP/fdb.cluster" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if fdbcli -C "$RUNNER_TEMP/fdb.cluster" --exec 'configure new single memory' --timeout 5 | grep -q 'Database created'; then
              break
            fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if fdbcli -C "$RUNNER_TEMP/fdb.cluster" --exec 'status minimal' --timeout 5 | grep -q 'The database is available'; then
              exit 0
            fi
            sleep 2
          done
          echo "FoundationDB did not become available"; exit 1

      - name: Run the FoundationDB suite
        env:
          GUMBO_REQUIRE_FDB: "true"
        run: mvn --batch-mode --no-transfer-progress -Dtest='FoundationDB*Test' -Dsurefire.failIfNoSpecifiedTests=false test

      # Belt and braces: the report has to say the tests ran. A skip here is a failure twice over.
      - name: Confirm nothing was skipped
        run: |
          set -euo pipefail
          grep -h "Tests run" target/surefire-reports/*FoundationDB*.txt
          if grep -h "Tests run" target/surefire-reports/*FoundationDB*.txt | grep -qv "Skipped: 0"; then
            echo "A FoundationDB test class was skipped"; exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports-fdb
          path: target/surefire-reports/
          retention-days: 14

  mutation:
    name: Mutation testing (persistence + service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # A green suite says the tests ran, not that they would have failed had the code
      # been wrong. Tests in this repo have passed against the very defect they were
      # written for, so the build checks that rather than assuming it. The threshold in
      # pom.xml is a ratchet: it fails if the score drops, not if it is merely imperfect.
      - name: Run mutation analysis
        run: mvn --batch-mode --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pit-report
          path: target/pit-reports/
          retention-days: 14
